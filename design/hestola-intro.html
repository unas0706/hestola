<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HESTOLA – Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500&display=swap">
<style>
:root{--y:#FFC500;--k:#050505;--w:#f4f2ea;--g:#8d8a80;--e:cubic-bezier(.4,0,.2,1);--o:cubic-bezier(.16,1,.3,1)}
html,body{height:100%;margin:0;background:var(--k);overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;background:var(--k);cursor:pointer;overflow:hidden}
.stage *,.stage::before{animation-play-state:paused}
.stage.go *,.stage.go::before{animation-play-state:running}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,197,0,.12),transparent 58%);opacity:0;will-change:opacity;animation:glow 7s .1s linear forwards}
.lay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.logo{width:min(64vw,300px);height:auto;color:var(--y);transform:translateZ(0)}
.d{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw var(--t) var(--s) var(--e) forwards}
.word{margin:.15em 0 0;font:400 clamp(46px,16vw,88px)/1 'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:.07em;padding-left:.07em;color:var(--w)}
.word span{display:inline-block;opacity:0;transform:translate3d(0,18px,0);will-change:transform,opacity;animation:rise 1.2s calc(3.6s + var(--i)*.08s) var(--o) forwards}
.tag{margin:.9em 0 0;font:500 12px/1 Inter,Helvetica,Arial,sans-serif;letter-spacing:.34em;padding-left:.34em;color:var(--g);opacity:0;transform:translate3d(0,8px,0);will-change:transform,opacity;animation:rise 1.4s 4.8s var(--o) forwards}
.fin{background:var(--y);opacity:0;will-change:opacity;animation:fade 1.4s 6.3s var(--e) forwards}
.fin .logo,.fin .word{color:var(--k)}
.fin .word span,.fin .tag{animation:none;opacity:1;transform:none;will-change:auto}
.fin .tag{color:#4a3c00}
.hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:500 11px/1 Inter,Helvetica,Arial,sans-serif;letter-spacing:.2em;color:var(--k);opacity:0;animation:hint 1s 8.2s forwards}
@keyframes draw{0%{opacity:0;stroke-dashoffset:1}3%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes glow{0%{opacity:0}20%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes fade{to{opacity:1}}
@keyframes hint{to{opacity:.55}}
@media (prefers-reduced-motion:reduce){
*,.stage::before{animation:none!important}
.stage::before{display:none}
.fin{opacity:1}
.d{opacity:1;stroke-dashoffset:0}
.word span,.tag{opacity:1;transform:none}
}
</style>
</head>
<body>

</div>

<h1 class="word"><span>H</span><span>E</span><span>S</span><span>T</span><span>O</span><span>L</span><span>A</span></h1>
<p class="tag">WEAR YOUR IDENTITY</p>
</div>
<div class="hint" aria-hidden="true">TAP TO REPLAY</div>
</div>
<script>
var s=document.getElementById('stage');
function start(){requestAnimationFrame(function(){requestAnimationFrame(function(){s.classList.add('go')})})}
var f=document.fonts&&document.fonts.load?Promise.all([document.fonts.load("40px 'Bebas Neue'"),document.fonts.load("12px Inter")]):Promise.resolve();
Promise.race([f,new Promise(function(r){setTimeout(r,1500)})]).then(start,start);
document.addEventListener('click',function(){var c=s.cloneNode(true);c.classList.remove('go');s.replaceWith(c);s=c;start()});
</script>
